name: Apple platform build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  simulator-build:
    runs-on: macos-15
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Test shared timer logic
        run: swift test --package-path Time4Shared

      - name: Build iPhone simulator app
        run: >-
          xcodebuild
          -project Time4.xcodeproj
          -scheme Time4
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO
          build
