name: Time4
options:
  minimumXcodeGenVersion: 2.45.4
  bundleIdPrefix: com.naoki
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
packages:
  Time4Shared:
    path: Time4Shared
targets:
  Time4:
    type: application
    platform: iOS
    sources:
      - Time4iOS
    dependencies:
      - package: Time4Shared
      - target: Time4Watch Watch App
    settings:
      GENERATE_INFOPLIST_FILE: YES
      CODE_SIGN_STYLE: Automatic
      DEVELOPMENT_TEAM: 98YMT83776
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      TARGETED_DEVICE_FAMILY: "1"
      SUPPORTS_MACCATALYST: NO
      SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
      PRODUCT_BUNDLE_IDENTIFIER: com.naoki.Time4
      MARKETING_VERSION: "1.0.0"
      CURRENT_PROJECT_VERSION: "3"
      INFOPLIST_KEY_CFBundleDisplayName: Time4
      INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
      INFOPLIST_KEY_UILaunchScreen_Generation: YES
      INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone:
        - UIInterfaceOrientationPortrait
  Time4Watch Watch App:
    type: application
    platform: watchOS
    sources:
      - Time4Watch
    dependencies:
      - package: Time4Shared
    settings:
      GENERATE_INFOPLIST_FILE: YES
      CODE_SIGN_STYLE: Automatic
      DEVELOPMENT_TEAM: 98YMT83776
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      PRODUCT_BUNDLE_IDENTIFIER: com.naoki.Time4.watchkitapp
      MARKETING_VERSION: "1.0.0"
      CURRENT_PROJECT_VERSION: "3"
      INFOPLIST_KEY_CFBundleDisplayName: Time4
      INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
      INFOPLIST_KEY_WKApplication: true
      INFOPLIST_KEY_WKCompanionAppBundleIdentifier: com.naoki.Time4
schemes:
  Time4:
    build:
      targets:
        Time4: all
        Time4Watch Watch App: all
    run:
      config: Debug
      storeKitConfiguration: StoreKit/Time4.storekit
  Time4Watch:
    build:
      targets:
        Time4Watch Watch App: all
    run:
      config: Debug
